server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Posters are capped at 5 MB by the API; nginx's default of 1 MB would
    # reject the upload with a 413 before the request ever reaches FastAPI.
    client_max_body_size 6m;

    # /api/auth/login -> http://backend:8000/auth/login (the trailing slash strips /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any other path (/movies/3, /admin/users...) serves
    # the SPA, and React Router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}