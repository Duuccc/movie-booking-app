services:
  postgres:
    image: postgres:16-alpine
    container_name: movie-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass
      POSTGRES_DB: moviebooking
    ports:
      - "5433:5432"
    volumes:
      - movie_booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d moviebooking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  movie_booking_pgdata:
